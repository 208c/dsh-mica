# ============================================================================
# dsh-mica —— DSH bundle 挂载声明
# ----------------------------------------------------------------------------
# DSH 启动时按 bundle 层栈叠加各插件的 patch，本文件把本插件的 host 行插进
# 组合树。host 行本身不注册 UI（UI 走 dsh.client 的 client bundle），它只提供
# 一个可选路由：把当前 Windows 桌面壁纸的调色板交给浏览器半侧。
# ============================================================================

- insert:
    - id: dsh-mica
      name: dsh-mica
